            },
            { 
                title: <a href="https://www.nsf.gov/awardsearch/show-award?AWD_ID=2121861" target="_blank" rel="noreferrer" className="hover:text-red-700 hover:underline">HBCU Faculty Mobility & Retention</a>, 
                description: (
                    <div>
                        Investigating the career trajectories, mobility patterns, and research dynamics of faculty members at Historically Black Colleges and Universities.
                        <br/><br/>
                        <strong>Key Outputs:</strong>
                        <ul className="list-disc pl-5 mt-2 space-y-1">
                            <li>
                                Hong, X., Yan, E., Palmer, R., & Ni, C. (Accepted). Untangling Faculty Turnover: Exploring Retention and Attribution at HBCUs. <em>American Educational Research Journal</em>. 
                                <a href="https://dx.doi.org/10.2139/ssrn.4900723" target="_blank" rel="noreferrer" className="inline-flex items-center text-red-600 hover:underline text-sm ml-2">
                                    View Paper <ExternalLink size={14} className="ml-1" />
                                </a>
                            </li>
                            <li>
                                Zheng, X., Yan, E., & Ni, C. (2024). Faculty Mobility and Research Dynamics at HBCUs. <em>Quantitative Science Studies</em>. 
                                <a href="https://doi.org/10.1162/qss_a_00334" target="_blank" rel="noreferrer" className="inline-flex items-center text-red-600 hover:underline text-sm ml-2">
                                    View Paper <ExternalLink size={14} className="ml-1" />
                                </a>
                            </li>
                        </ul>
                        <div className="mt-3 text-sm italic text-slate-600">
                            See more publications from my group on <a href={PROFILE.scholarLink} target="_blank" rel="noreferrer" className="text-red-700 hover:underline">Google Scholar</a>.
                        </div>
                    </div>
                ),
                status: "Finished (NSF Funded)", 
                collaborators: "Erjia Yan (Drexel), Robert Palmer (Howard), Mat Kelly (Drexel), Jiangen He (UTK)" 
            }
        ];

        // --- COMPONENTS ---

        const NavItem = ({ section, current, onClick, label, icon: Icon }) => (
            <button
                onClick={() => onClick(section)}
                className={`flex items-center space-x-2 px-4 py-2 rounded-md transition-all duration-200 ${
                current === section 
                    ? "bg-red-50 text-red-700 font-medium" 
                    : "text-slate-600 hover:bg-slate-50 hover:text-slate-900"
                }`}
            >
                <Icon size={18} />
                <span>{label}</span>
            </button>
        );

        const SectionHeading = ({ children }) => (
            <h2 className="text-2xl font-bold text-slate-800 border-b border-slate-200 pb-2 mb-6">
                {children}
            </h2>
        );

        const Card = ({ children, className = "" }) => (
            <div className={`bg-white p-6 rounded-lg border border-slate-100 shadow-sm hover:shadow-md transition-shadow ${className}`}>
                {children}
            </div>
        );

        const Badge = ({ type }) => {
            const colors = {
                Journal: "bg-purple-100 text-purple-700",
                Conference: "bg-blue-100 text-blue-700",
                Preprint: "bg-gray-100 text-gray-700",
                Undergraduate: "bg-orange-100 text-orange-700",
                Graduate: "bg-indigo-100 text-indigo-700"
            };
            return (
                <span className={`text-xs font-semibold px-2.5 py-0.5 rounded ${colors[type] || "bg-gray-100 text-gray-700"}`}>
                {type}
                </span>
            );
        };

        // --- MAIN APP ---

        function App() {
            const [activeSection, setActiveSection] = useState('home');
            const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
            const [imageError, setImageError] = useState(false); // New state for image error handling

            const handleNav = (section) => {
                setActiveSection(section);
                setMobileMenuOpen(false);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const renderContent = () => {
                switch (activeSection) {
                    case 'research':
                        return (
                        <div className="animate-fade-in">
                            <SectionHeading>Research Projects & Lab</SectionHeading>
                            <div className="grid gap-6">
                            {RESEARCH_PROJECTS.map((project, idx) => (
                                <Card key={idx}>
                                <div className="flex justify-between items-start">
                                    <h3 className="text-xl font-semibold text-slate-800 mb-2">{project.title}</h3>
                                    <span className="text-xs bg-red-50 text-red-700 px-2 py-1 rounded-full border border-red-100">
                                    {project.status}
                                    </span>
                                </div>
                                <div className="text-slate-600 mb-4 leading-relaxed">{project.description}</div>
                                <div className="text-sm text-slate-500 bg-slate-50 p-3 rounded flex gap-2 items-center">
                                    <Users size={16} />
                                    <span><strong>Collaborators:</strong> {project.collaborators}</span>
                                </div>
                                </Card>
                            ))}
                            </div>
                            
                            <div className="mt-12">
                            <SectionHeading>Research Interests</SectionHeading>
                            <div className="flex flex-wrap gap-3">
                                {PROFILE.interests.map((interest, i) => (
                                <span key={i} className="px-4 py-2 bg-white border border-slate-200 rounded-full text-slate-700 shadow-sm flex items-center gap-2">
                                    <Database size={14} className="text-slate-400"/>
                                    {interest}
                                </span>
                                ))}
                            </div>
                            </div>
                        </div>
                        );

                    case 'publications':
                        return (
                        <div className="animate-fade-in">
                            <SectionHeading>Selected Publications</SectionHeading>
                            <div className="space-y-4">
                            {PUBLICATIONS.map((pub) => (
                                <div key={pub.id} className="group bg-white p-5 rounded-lg border border-slate-100 hover:border-red-200 transition-all">
                                <div className="flex justify-between items-start mb-1">
                                    <h3 className="font-semibold text-lg text-slate-800 group-hover:text-red-700">
                                    {pub.title}
                                    </h3>
                                    <Badge type={pub.tag} />
                                </div>
                                <p className="text-slate-600 mb-1 text-sm">{pub.authors}</p>
                                <div className="flex items-center justify-between mt-2">
                                    <p className="text-slate-500 italic text-sm">{pub.journal}, {pub.year}</p>
                                    <a href={pub.link} className="flex items-center text-sm text-red-600 hover:underline">
                                    View Paper <ExternalLink size={14} className="ml-1" />
                                    </a>
                                </div>
                                </div>
                            ))}
                            </div>
                            <div className="mt-8 text-center">
                            <a href={PROFILE.scholarLink} target="_blank" rel="noreferrer" className="inline-flex items-center px-6 py-3 bg-slate-800 text-white rounded-lg hover:bg-slate-700 transition-colors">
                                <BookOpen size={18} className="mr-2" />
                                View Full List on Google Scholar
                            </a>
                            </div>
                        </div>
                        );

                    case 'teaching':
                        return (
                        <div className="animate-fade-in">
                            <SectionHeading>Teaching</SectionHeading>
                            <div className="grid md:grid-cols-2 gap-6 mb-12">
                            {TEACHING.map((course, idx) => (
                                <Card key={idx} className="border-l-4 border-l-red-600">
                                <div className="flex justify-between items-start mb-2">
                                    <span className="font-mono text-sm text-slate-500">{course.code}</span>
                                    <Badge type={course.level} />
                                </div>
                                <h3 className="font-bold text-slate-800 text-lg mb-1">{course.title}</h3>
                                <p className="text-slate-600 text-sm">{course.term}</p>
                                </Card>
                            ))}
                            </div>

                            <SectionHeading>Note for Students</SectionHeading>
                            <Card>
                            <p className="text-slate-700 leading-relaxed">
                                I teach in the areas of information technology, database management, statistical data analysis, data interoperability, information visualization, and research methods.
                                <br/><br/>
                                <strong>Office Hours:</strong> No regular office hours currently; Please request appointments by email.
                            </p>
                            </Card>
                        </div>
                        );

                    case 'home':
                    default:
                        return (
                        <div className="animate-fade-in">
                            {/* Hero Section */}
                            <div className="flex flex-col md:flex-row items-center gap-8 mb-12">
                            <div className="w-48 h-48 md:w-64 md:h-64 shrink-0 bg-slate-100 rounded-full overflow-hidden border-4 border-white shadow-lg flex items-center justify-center text-slate-400">
                                {/* Image with Fallback Logic */}
                                {!imageError ? (
                                    <img 
                                        src="profile.jpg" 
                                        alt="Dr. Chaoqun Ni" 
                                        className="w-full h-full object-cover"
                                        style={{ filter: 'contrast(1.05)' }} // Slight contrast boost to sharpen
                                        onError={() => setImageError(true)}
                                    />
                                ) : (
                                    <Users size={64} />
                                )}
                            </div>
                            <div className="text-center md:text-left">
                                <h1 className="text-4xl font-bold text-slate-900 mb-2">{PROFILE.name}</h1>
                                <p className="text-xl text-slate-600 mb-1">{PROFILE.title}</p>
                                <p className="text-lg text-slate-500 mb-6">{PROFILE.department}<br />{PROFILE.university}</p>
                                <div className="flex flex-wrap gap-4 justify-center md:justify-start">
                                <button onClick={() => handleNav('research')} className="bg-red-700 text-white px-6 py-2 rounded-lg font-medium hover:bg-red-800 transition-colors shadow-sm">
                                    Research Areas
                                </button>
                                <button onClick={() => handleNav('publications')} className="bg-white text-slate-700 border border-slate-300 px-6 py-2 rounded-lg font-medium hover:bg-slate-50 transition-colors shadow-sm">
                                    Publications
                                </button>
                                <a href="https://metasci.ischool.wisc.edu/" target="_blank" rel="noreferrer" className="bg-white text-slate-700 border border-slate-300 px-6 py-2 rounded-lg font-medium hover:bg-slate-50 transition-colors shadow-sm flex items-center">
                                    Metascience Research Lab <ExternalLink size={16} className="ml-2" />
                                </a>
                                </div>
                            </div>
                            </div>

                            <div className="grid md:grid-cols-3 gap-8">
                            {/* About Column */}
                            <div className="md:col-span-2">
                                <SectionHeading>About Me</SectionHeading>
                                <div className="text-slate-700 text-lg leading-relaxed mb-6">
                                {PROFILE.about}
                                </div>
                                
                                <h3 className="font-bold text-slate-800 mb-3 flex items-center">
                                <Award className="mr-2 text-yellow-600" size={20} /> 
                                Updates & News
                                </h3>
                                <ul className="space-y-4">
                                {NEWS.map((item, i) => (
                                    <li key={i} className="flex gap-3 text-slate-700 bg-white p-3 rounded border border-slate-100 shadow-sm">
                                    <span className="font-mono text-sm font-bold text-red-600 shrink-0 pt-1 w-16">{item.date}</span>
                                    <span>{item.text}</span>
                                    </li>
                                ))}
                                </ul>
                            </div>

                            {/* Contact Sidebar */}
                            <div className="md:col-span-1 space-y-6"> {/* Added space-y-6 for vertical spacing */}
                                <Card className="bg-slate-50 border-none sticky top-24">
                                <h3 className="font-bold text-slate-900 mb-4">Contact Info</h3>
                                <div className="space-y-4 text-sm">
                                    <div className="text-slate-700 mb-4 border-b border-slate-200 pb-4">
                                        <p>Information School</p>
                                        <p>School of Computing, Data and Information Sciences (CDIS)</p>
                                        <p>College of Letters & Sciences</p>
                                        <p>University of Wisconsin-Madison</p>
                                    </div>

                                    <div className="flex items-start gap-3">
                                        <Mail className="text-red-600 shrink-0" size={18} />
                                        <span className="text-slate-700 break-all">{PROFILE.email}</span>
                                    </div>

                                    <div className="flex items-start gap-3">
                                        <MapPin className="text-red-600 shrink-0" size={18} />
                                        <span className="text-slate-700">{PROFILE.office}<br/>Madison, WI 53706</span>
                                    </div>
                                    
                                    <hr className="border-slate-200 my-4" />
                                    
                                    <div className="flex gap-4 justify-center">
                                        {PROFILE.scholarLink && (
                                            <a href={PROFILE.scholarLink} target="_blank" rel="noreferrer" className="hover:opacity-80 transition-opacity" title="Google Scholar">
                                                <GoogleScholar size={32} />
                                            </a>
                                        )}
                                        {PROFILE.researchGateLink && (
                                            <a href={PROFILE.researchGateLink} target="_blank" rel="noreferrer" className="hover:opacity-80 transition-opacity" title="ResearchGate">
                                                <ResearchGate size={32} />
                                            </a>
                                        )}
                                        {PROFILE.linkedinLink && (
                                            <a href={PROFILE.linkedinLink} target="_blank" rel="noreferrer" className="hover:opacity-80 transition-opacity" title="LinkedIn">
                                                <Linkedin size={32} />
                                            </a>
                                        )}
                                        {PROFILE.orcidLink && (
                                            <a href={PROFILE.orcidLink} target="_blank" rel="noreferrer" className="hover:opacity-80 transition-opacity" title="ORCID">
                                                <Orcid size={32} />
                                            </a>
                                        )}
                                    </div>
                                </div>
                                </Card>

                                {/* New Recruitment Card */}
                                <Card className="bg-red-50 border-red-100 sticky top-[32rem]"> {/* Adjusted sticky top position */}
                                    <h3 className="font-bold text-red-800 mb-3 flex items-center">
                                        <Users className="mr-2" size={20} />
                                        Join My Group
                                    </h3>
                                    <p className="text-sm text-slate-700 leading-relaxed mb-4">
                                        I welcome Ph.D., Master's, and undergraduate students to join my group. We work on broad topics in the science of science and computational social science, with a particular focus on understanding how AI influences the research ecosystem.
                                    </p>
                                    <a 
                                        href={`mailto:${PROFILE.email}`} 
                                        className="inline-block w-full text-center py-2 px-4 bg-white text-red-700 font-medium rounded border border-red-200 hover:bg-red-50 hover:border-red-300 transition-colors text-sm"
                                    >
                                        Email to Get in Touch
                                    </a>
                                </Card>

                                {/* CV Download Button */}
                                <a 
                                    href={PROFILE.cvLink} 
                                    target="_blank"
                                    rel="noreferrer"
                                    className="flex items-center justify-center w-full py-3 px-4 bg-slate-800 text-white font-medium rounded shadow hover:bg-slate-700 transition-colors"
                                >
                                    <Download className="mr-2" size={20} />
                                    Download Full CV
                                </a>
                            </div>
                            </div>
                        </div>
                        );
                }
            };

            return (
                <div className="min-h-screen bg-slate-50 font-sans text-slate-900">
                <nav className="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
                    <div className="max-w-6xl mx-auto px-4">
                    <div className="flex justify-between items-center h-16">
                        <div className="font-bold text-xl tracking-tight text-slate-800 cursor-pointer" onClick={() => handleNav('home')}>
                        Chaoqun <span className="text-red-700">Ni</span>
                        </div>

                        <div className="hidden md:flex space-x-1">
                        <NavItem section="home" current={activeSection} onClick={handleNav} label="Home" icon={Users} />
                        <NavItem section="research" current={activeSection} onClick={handleNav} label="Research" icon={FileText} />
                        <NavItem section="publications" current={activeSection} onClick={handleNav} label="Publications" icon={BookOpen} />
                        <NavItem section="teaching" current={activeSection} onClick={handleNav} label="Teaching" icon={GraduationCap} />
                        </div>

                        <button 
                        className="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded"
                        onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                        >
                        {mobileMenuOpen ? <X size={24} /> : <Menu size={24} />}
                        </button>
                    </div>
                    </div>

                    {mobileMenuOpen && (
                    <div className="md:hidden bg-white border-t border-slate-100 px-4 py-2 space-y-2 shadow-lg">
                        <button onClick={() => handleNav('home')} className="block w-full text-left py-2 px-2 text-slate-700 hover:bg-slate-50 rounded">Home</button>
                        <button onClick={() => handleNav('research')} className="block w-full text-left py-2 px-2 text-slate-700 hover:bg-slate-50 rounded">Research</button>
                        <button onClick={() => handleNav('publications')} className="block w-full text-left py-2 px-2 text-slate-700 hover:bg-slate-50 rounded">Publications</button>
                        <button onClick={() => handleNav('teaching')} className="block w-full text-left py-2 px-2 text-slate-700 hover:bg-slate-50 rounded">Teaching</button>
                    </div>
                    )}
                </nav>

                <main className="max-w-6xl mx-auto px-4 py-8 md:py-12">
                    {renderContent()}
                </main>

                <footer className="bg-white border-t border-slate-200 mt-auto py-8">
                    <div className="max-w-6xl mx-auto px-4 text-center text-slate-500 text-sm">
                    <p>&copy; {new Date().getFullYear()} {PROFILE.name}. All rights reserved.</p>
                    <p className="mt-2">{PROFILE.department}, {PROFILE.university}.</p>
                    </div>
                </footer>
                </div>
            );
        }

        // Render the App
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
